name: LiDO2 validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scenario-tests:
    name: scenario-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_scenario_engine -v

  api-validation:
    name: api-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_api tests.test_open_data_service -v
